[package]
name = "oxideav-indeo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxideav-indeo]
path = ".."

[[bin]]
name = "indeo5_decoder"
path = "fuzz_targets/indeo5_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "indeo3_picture"
path = "fuzz_targets/indeo3_picture.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
